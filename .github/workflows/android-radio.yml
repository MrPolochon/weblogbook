name: Android radio

on:
  push:
    branches: [main]
    paths: ['vhf-radio-android/**', '.github/workflows/android-radio.yml']
  pull_request:
    branches: [main]
    paths: ['vhf-radio-android/**', '.github/workflows/android-radio.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-radio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: vhf-radio-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore permanent distribution signature
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: python3 scripts/release.py signing
      - name: Build and verify
        run: gradle --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 lifecycle smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: vhf-radio-android
          script: python3 scripts/test_update.py
      - name: Prepare signed beta APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/release.py package
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: VHF-Radio-Android
          path: vhf-radio-android/dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            vhf-radio-android/app/build/reports/
            vhf-radio-android/app/build/outputs/androidTest-results/
            vhf-radio-android/update-install-test.txt
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/vhf-radio-signing.p12"
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VHF-Radio-Android
          path: dist
      - name: Publish Android beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 vhf-radio-android/scripts/publish.py
