name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Tests + Lint + TypeCheck + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Cloudflare room tests
        run: npm --prefix realtime-worker test

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          CLOUDFLARE_REALTIME_URL: ${{ secrets.CLOUDFLARE_REALTIME_URL || 'wss://placeholder.workers.dev/connect' }}

  windows-radio:
    name: Windows radio installer
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vhf-radio-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vhf-radio-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx --no-install electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: VHF-Radio-Windows
          path: |
            vhf-radio-app/release/*.exe
            vhf-radio-app/release/*.blockmap
            vhf-radio-app/release/latest.yml
      - name: Publish tested Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } | Select-Object -ExpandProperty FullName
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VHF Radio $version" --notes "COM box du site avec PTT global Windows, présélection à molettes, écoute OBS et reconnexion automatique."
          if ($LASTEXITCODE -ne 0) { throw 'Publication de la radio Windows impossible.' }
